name: Azure development deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - staging
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: azure-development
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/saas-obra

jobs:
  deploy:
    name: Build and deploy Azure development
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Resolve source revision
        id: source
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:staging
            ${{ env.IMAGE_NAME }}:staging-${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_NAME=Deming
            VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and application
        shell: bash
        run: |
          az deployment sub create \
            --name "deming-dev-${{ github.run_id }}" \
            --location brazilsouth \
            --template-file infra/azure/main.bicep \
            --parameters infra/azure/dev.bicepparam \
            --parameters \
              deployApplication=true \
              containerImage="${IMAGE_NAME}:staging-${{ steps.source.outputs.sha }}" \
              postgresAdminPassword="${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}" \
              appKey="${{ secrets.AZURE_APP_KEY }}" \
              storageConnectionString="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --only-show-errors

      - name: Smoke test
        shell: bash
        run: |
          APP_URL="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          for attempt in {1..20}; do
            if curl --fail --silent --show-error "https://${APP_URL}/up" >/dev/null; then
              echo "Azure development is healthy at https://${APP_URL}"
              exit 0
            fi
            sleep 15
          done

          echo "Azure development health check failed."
          exit 1
