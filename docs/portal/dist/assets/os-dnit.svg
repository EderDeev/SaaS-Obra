<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 554" role="img"><title>Fluxo da OS DNIT</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58708c"/></marker></defs><rect width="1160" height="554" fill="#ffffff"/><text x="34" y="42" fill="#1f2328" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start">Fluxo da OS DNIT</text><rect x="34" y="127" width="228" height="142" rx="6" fill="#24476f" stroke="#24476f" stroke-width="1.5"/><text x="50" y="156" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Analista DNIT</text><text x="50" y="180" fill="#dae7f9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Cria rascunho, revisa e</text><text x="50" y="199" fill="#dae7f9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">envia</text><rect x="358" y="127" width="275" height="142" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="374" y="156" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Fiscal Concremat</text><text x="374" y="180" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Comenta, estima prazo e analisa</text><text x="374" y="199" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">produtos e quantidades</text><rect x="729" y="127" width="275" height="142" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="745" y="156" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Fiscal do contrato</text><text x="745" y="180" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Compara as propostas e decide</text><path d="M 262 193 L 358 193" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><text x="310.0" y="181.0" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">confirmação</text><path d="M 633 193 L 729 193" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><text x="681.0" y="181.0" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">encaminhar</text><rect x="729" y="388" width="275" height="105" rx="6" fill="#eef7ee" stroke="#8cbf8c" stroke-width="1.5"/><text x="745" y="417" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Aprovada</text><text x="745" y="441" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Fluxo encerrado</text><path d="M 866 269 L 866 388" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><text x="866.0" y="316.5" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">aprovar</text><path d="M 760 269 L 760 319 L 494 319 L 494 269" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><text x="590" y="308" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">Devolver à Concremat</text><path d="M 1004 196 L 1080 196 L 1080 356 L 148 356 L 148 269" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><text x="357" y="379" fill="#243e5c" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Devolver ao analista: problemas no pedido.</text><text x="34" y="451" fill="#1f2328" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">Depois de enviado, o pedido não pode mais ser editado.</text><text x="34" y="480" fill="#243e5c" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Toda devolução precisa de comentário e destino.</text></svg>