<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img"><title>Tenant, contrato e acesso</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58708c"/></marker></defs><rect width="1120" height="570" fill="#ffffff"/><text x="34" y="42" fill="#1f2328" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start">Tenant, contrato e acesso</text><rect x="34" y="116" width="240" height="102" rx="6" fill="#24476f" stroke="#24476f" stroke-width="1.5"/><text x="50" y="145" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Conta da pessoa</text><text x="50" y="169" fill="#dae7f9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Uma identidade global</text><rect x="370" y="116" width="300" height="102" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="386" y="145" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Empresa Exemplo / tenant</text><text x="386" y="169" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Vínculo ativo e contexto da empresa</text><path d="M 274 166 L 370 166" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><text x="322.0" y="154.0" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" text-anchor="middle">vínculo</text><rect x="370" y="290" width="300" height="112" rx="6" fill="#eef7ee" stroke="#8cbf8c" stroke-width="1.5"/><text x="386" y="319" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Contrato CT-001</text><text x="386" y="343" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Participação ativa + permissão +</text><text x="386" y="362" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">papel quando exigido</text><rect x="748" y="290" width="300" height="112" rx="6" fill="#fff8e1" stroke="#d4a72c" stroke-width="1.5"/><text x="764" y="319" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Contrato CT-002</text><text x="764" y="343" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Sem vínculo: acesso não concedido</text><path d="M 520 218 L 520 290" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><path d="M 670 166 L 898 166 L 898 290" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><rect x="370" y="457" width="678" height="73" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="386" y="486" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Dados do contrato</text><text x="386" y="510" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">OS, atividades, projetos e documentos seguem suas regras próprias</text><path d="M 520 402 L 520 457" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><text x="34" y="478" fill="#243e5c" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">O endereço identifica o ambiente.</text><text x="34" y="504" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" text-anchor="start">A autorização decide o acesso.</text></svg>