<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 325" role="img"><title>Do arquivo ao visualizador Autodesk</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58708c"/></marker></defs><rect width="1160" height="325" fill="#ffffff"/><text x="34" y="42" fill="#1f2328" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start">Do arquivo ao visualizador Autodesk</text><rect x="34" y="126" width="170" height="115" rx="6" fill="#24476f" stroke="#24476f" stroke-width="1.5"/><text x="50" y="155" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Arquivo</text><text x="50" y="176" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">original</text><text x="50" y="200" fill="#dae7f9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Cadastro e revisão</text><path d="M 204 184 L 265 184" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><rect x="265" y="126" width="170" height="115" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="281" y="155" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Fila APS</text><text x="281" y="179" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Worker inicia</text><text x="281" y="198" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">envio</text><path d="M 435 184 L 496 184" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><rect x="496" y="126" width="170" height="115" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="512" y="155" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">OSS + conversão</text><text x="512" y="179" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Autodesk processa</text><path d="M 666 184 L 727 184" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><rect x="727" y="126" width="170" height="115" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="743" y="155" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Manifesto</text><text x="743" y="179" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Sucesso ou falha</text><path d="M 897 184 L 958 184" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><rect x="958" y="126" width="170" height="115" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="974" y="155" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Viewer</text><text x="974" y="179" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Modelo convertido</text><text x="34" y="292" fill="#243e5c" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">O navegador recebe só um token de visualização; o client secret fica no servidor.</text></svg>