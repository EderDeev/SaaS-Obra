<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 475" role="img"><title>Como o assistente monta a resposta</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58708c"/></marker></defs><rect width="1160" height="475" fill="#ffffff"/><text x="34" y="42" fill="#1f2328" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start">Como o assistente monta a resposta</text><rect x="34" y="139" width="170" height="150" rx="6" fill="#24476f" stroke="#24476f" stroke-width="1.5"/><text x="50" y="168" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Pergunta</text><text x="50" y="192" fill="#dae7f9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Usuário, tenant e</text><text x="50" y="211" fill="#dae7f9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">tela atual</text><rect x="265" y="139" width="170" height="150" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="281" y="168" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Autorizar</text><text x="281" y="192" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Contrato, módulo,</text><text x="281" y="211" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">registro e cota</text><rect x="496" y="139" width="170" height="150" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="512" y="168" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Recuperar</text><text x="512" y="192" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">SQL + guias; busca</text><text x="512" y="211" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">por termos e</text><text x="512" y="230" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">prioridade</text><rect x="727" y="139" width="170" height="150" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="743" y="168" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Gerar</text><text x="743" y="192" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Contexto limitado</text><text x="743" y="211" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">enviado à API de</text><text x="743" y="230" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">IA</text><rect x="958" y="139" width="170" height="150" rx="6" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.5"/><text x="974" y="168" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Revisar</text><text x="974" y="192" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Resposta e</text><text x="974" y="211" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">proposta de ação</text><text x="974" y="230" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">validada</text><path d="M 204 209 L 265 209" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><path d="M 435 209 L 496 209" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><path d="M 666 209 L 727 209" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><path d="M 897 209 L 958 209" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/><rect x="265" y="347" width="863" height="86" rx="6" fill="#eef7ee" stroke="#8cbf8c" stroke-width="1.5"/><text x="281" y="376" fill="#142c49" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Quem salva é o usuário</text><text x="281" y="400" fill="#526982" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">O chat só preenche o formulário; salvar e aprovar continuam nas telas.</text><path d="M 1043 289 L 1043 347" fill="none" stroke="#58708c" stroke-width="2.3" marker-end="url(#a)"/></svg>