<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-label="Identidade global · diretoria · contrato · operação"><rect width="100%" height="100%" rx="20" fill="#f4f7fb"/><text x="35" y="42" fill="#142b49" font-size="23" font-family="Arial,sans-serif" font-weight="bold">Identidade global · diretoria · contrato · operação</text><rect x="35" y="65" width="930" height="72" rx="10" fill="white" stroke="#cad6e5"/><rect x="35" y="65" width="5" height="72" fill="#0b5fff"/><text x="57" y="92" fill="#142b49" font-size="18" font-family="Arial,sans-serif" font-weight="bold">Usuário global (users)</text><text x="57" y="117" fill="#4d6078" font-size="15" font-family="Arial,sans-serif">Uma pessoa pode acessar várias diretorias, conforme os vínculos ativos.</text><text x="490" y="156" font-size="20" fill="#0b5fff">↓</text><rect x="35" y="160" width="930" height="72" rx="10" fill="white" stroke="#cad6e5"/><rect x="35" y="160" width="5" height="72" fill="#0b5fff"/><text x="57" y="187" fill="#142b49" font-size="18" font-family="Arial,sans-serif" font-weight="bold">Diretoria / Tenant (tenants + tenant_users)</text><text x="57" y="212" fill="#4d6078" font-size="15" font-family="Arial,sans-serif">Diretoria selecionada na sessão web ou associada ao token mobile.</text><text x="490" y="251" font-size="20" fill="#0b5fff">↓</text><rect x="35" y="255" width="930" height="72" rx="10" fill="white" stroke="#cad6e5"/><rect x="35" y="255" width="5" height="72" fill="#0b5fff"/><text x="57" y="282" fill="#142b49" font-size="18" font-family="Arial,sans-serif" font-weight="bold">Contrato (contracts + contract_participants)</text><text x="57" y="307" fill="#4d6078" font-size="15" font-family="Arial,sans-serif">Pertence à diretoria; possui empresas participantes e obras vinculadas.</text><text x="490" y="346" font-size="20" fill="#0b5fff">↓</text><rect x="35" y="350" width="930" height="72" rx="10" fill="white" stroke="#cad6e5"/><rect x="35" y="350" width="5" height="72" fill="#0b5fff"/><text x="57" y="377" fill="#142b49" font-size="18" font-family="Arial,sans-serif" font-weight="bold">Documento e etapa</text><text x="57" y="402" fill="#4d6078" font-size="15" font-family="Arial,sans-serif">Obra/frente · parte responsável · status · permissão · snapshot do modelo</text><text x="35" y="492" fill="#4d6078" font-size="14" font-family="Arial,sans-serif">A interface orienta; o backend revalida tenant, contrato, recurso e etapa em cada operação.</text></svg>